; 21-LMS tests queue worker
; Copy this file to /etc/supervisor/conf.d/21-lms-tests-worker.conf
; or adapt it in your hosting panel process manager.

[program:21-lms-tests-worker]
process_name=%(program_name)s_%(process_num)02d
command=/bin/bash /home/smurod_8880/projects/21-lms/scripts/workers/tests-worker.sh
numprocs=1
directory=/home/smurod_8880/projects/21-lms
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=60
killasgroup=true
stopasgroup=true
user=smurod_8880
redirect_stderr=true
stdout_logfile=/home/smurod_8880/projects/21-lms/storage/logs/tests-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10

environment=PROJECT_DIR="/home/smurod_8880/projects/21-lms",PHP_BIN="/usr/bin/php",QUEUE_NAMES="tests,default",QUEUE_TRIES="1",QUEUE_TIMEOUT="600",QUEUE_SLEEP="2",QUEUE_MEMORY="512"
