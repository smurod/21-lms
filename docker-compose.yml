# =============================================================================
# 21 LMS — full stack in one `docker compose up`
#
#   nginx :80          → Laravel (php-fpm "app")
#   db       (PostgreSQL 16, LMS data)
#   redis              → cache / queue backend (optional but recommended)
#   queue    → php artisan queue:work
#   scheduler→ php artisan schedule:work
#   datalens-ai :8100  → FastAPI text-to-dashboard service
#   + DataLens OSS stack (ui :8085, auth, us, control-api, data-api, ...)
#     included from analytics/datalens/docker-compose.yaml
#
# All configuration lives in the root .env (see .env.example).
#
# Requires Docker Compose v2.24+ (include:, env_file required:false).
# =============================================================================

name: lms

include:
    - ./analytics/datalens/docker-compose.yaml

services:
    # ------------------------------------------------------------------ LMS DB
    db:
        image: postgres:16-alpine
        container_name: lms-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - lms-db:/var/lib/postgresql/data
        ports:
            # exposed on localhost only — debugging convenience
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE} -U ${DB_USERNAME}"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 5s

    redis:
        image: redis:7-alpine
        container_name: lms-redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - lms-redis:/data
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 6

    # ------------------------------------------------------------ Laravel app
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: lms-app
        container_name: lms-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # inside the compose network Laravel must reach services by name,
            # not by the 127.0.0.1 defaults from .env
            DB_HOST: db
            DB_PORT: "5432"
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            DATALENS_AI_URL: http://datalens-ai:8100
            # browser opens SSE to the published port, not to the service name
            DATALENS_AI_PUBLIC_URL: http://localhost:${AI_PORT:-8100}
        volumes:
            - lms-storage:/var/www/html/storage
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        # built from the same Dockerfile (target: web) so that public/ with
        # the Vite build lives inside the nginx image
        build:
            context: .
            dockerfile: Dockerfile
            target: web
        image: lms-web
        container_name: lms-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - lms-storage:/var/www/html/storage:ro
        depends_on:
            - app
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s

    queue:
        image: lms-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DB_HOST: db
            DB_PORT: "5432"
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            DATALENS_AI_URL: http://datalens-ai:8100
            DATALENS_AI_PUBLIC_URL: http://localhost:${AI_PORT:-8100}
        volumes:
            - lms-storage:/var/www/html/storage
        command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300", "--max-time=3600"]
        depends_on:
            app:
                condition: service_started
            db:
                condition: service_healthy

    scheduler:
        image: lms-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DB_HOST: db
            DB_PORT: "5432"
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            DATALENS_AI_URL: http://datalens-ai:8100
            DATALENS_AI_PUBLIC_URL: http://localhost:${AI_PORT:-8100}
        volumes:
            - lms-storage:/var/www/html/storage
        command: ["php", "artisan", "schedule:work"]
        depends_on:
            app:
                condition: service_started
            db:
                condition: service_healthy

    # --------------------------------------------------------- datalens-ai
    datalens-ai:
        build:
            context: ./analytics/datalens-ai
            dockerfile: Dockerfile
        container_name: datalens-ai
        restart: unless-stopped
        env_file:
            # provider keys (LLM_*), credentials — the service's own .env;
            # may be absent, then only root .env + environment block are used
            - path: ./analytics/datalens-ai/.env
              required: false
        environment:
            # ----- inside the compose network everything is addressed by
            # ----- service name (overrides the host-mode defaults in .env)
            DATALENS_BASE_URL: http://ui:8080
            DATALENS_AUTH_URL: http://auth:8080
            DATALENS_US_URL: http://us:8080
            DATALENS_DB_HOST: db
            DATALENS_DB_PORT: "5432"
            DATALENS_DB_NAME: ${DB_DATABASE}
            DATALENS_DB_USER: ${DB_USERNAME}
            DATALENS_DB_PASSWORD: ${DB_PASSWORD}
            DB_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
            # ----- shared secret comes from the ROOT .env (single source of
            # ----- truth for both sides)
            SERVICE_API_KEY: ${DATALENS_AI_API_KEY:-}
            # ----- the admin UI is served by nginx on APP_PORT
            CORS_ORIGINS: http://localhost:${APP_PORT:-80},http://127.0.0.1:${APP_PORT:-80}
        ports:
            # published for the browser (SSE stream to the admin panel)
            - "${AI_PORT:-8100}:8100"
        depends_on:
            db:
                condition: service_healthy
            ui:
                condition: service_started

volumes:
    lms-db:
    lms-redis:
    lms-storage:
