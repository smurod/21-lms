version: "3.9"

# Standalone compose for datalens-ai only.
# DataLens itself is started separately via analytics/datalens/docker-compose.yaml.
#
# Usage:
#   cd analytics/datalens-ai
#   cp .env.example .env          # fill OPENAI_API_KEY, SERVICE_API_KEY, DB_URL …
#   docker compose up -d --build
#   docker compose logs -f

services:
    datalens-ai:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: datalens-ai
        ports:
            - "8100:8100"
        env_file:
            - .env
        # The service connects to PostgreSQL and DataLens on the host machine.
        # host.docker.internal works on Docker Desktop; on Linux use 172.17.0.1
        # or add --add-host=host.docker.internal:host-gateway to extra_hosts below.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        healthcheck:
            test:
                - "CMD"
                - "python3"
                - "-c"
                - "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=8)"
            interval: 30s
            timeout: 10s
            start_period: 20s
            retries: 3
