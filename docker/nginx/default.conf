# 21 LMS — nginx front for php-fpm (service "app")

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 60m;

    # Long-running AI generation requests (LLM pipelines can take minutes)
    fastcgi_read_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolve "app" at request time via Docker's embedded DNS so nginx
        # survives php-fpm restarts (a static upstream would crash on boot
        # when app is not yet resolvable).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fastcgi_upstream app;
        fastcgi_pass $fastcgi_upstream:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Vite build assets are content-hashed — cache aggressively
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|avif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
